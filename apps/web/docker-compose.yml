services:
  scout-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: scout-web
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - scout-data:/data
    env_file:
      - .env
    environment:
      - FUSION_HOST=0.0.0.0
      - FUSION_PORT=8080
      - FUSION_DB_PATH=/data/fusion.db

volumes:
  scout-data:
    name: scout_web_data
